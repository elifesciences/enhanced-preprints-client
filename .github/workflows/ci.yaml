name: CI Pipeline

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - master
    tags:
      - '*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read .nvmrc
        run: echo "NVMRC=$(cat .nvmrc)" >> $GITHUB_OUTPUT
        id: nvm
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Use Node.js (.nvmrc)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "${{ steps.nvm.outputs.NVMRC }}"
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: TSC
        run: make compile-typescript
      - name: Check circular dependencies
        run: make check-circular-dependencies
      - name: Lint
        run: make lint
      - name: Unit Test
        run: pnpm test --reporters=jest-wip-reporter
  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read .nvmrc
        run: echo "NVMRC=$(cat .nvmrc)" >> $GITHUB_OUTPUT
        id: nvm
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Use Node.js (.nvmrc)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "${{ steps.nvm.outputs.NVMRC }}"
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Install operating system dependencies
        run: |
          pnpm exec playwright install
          pnpm exec playwright install-deps
      - name: Pull browser test images
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
          if docker compose pull; then
            exit 0
          fi
          if [ "$attempt" -lt 5 ]; then
            echo "Docker image pull failed; retrying in $((attempt * 15)) seconds..."
            sleep $((attempt * 15))
          fi
          done
          echo "Docker image pull failed after 5 attempts"
          exit 1
      - name: Bring up browser test stack
        run: docker compose up --wait
      - name: Debug bring up browser test stack
        if: failure()
        run: docker compose logs app
      - name: Browser Tests
        run: pnpm test:browser
      - name: Take down browser test stack
        run: docker compose down
  test-chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Read .nvmrc
        run: echo "NVMRC=$(cat .nvmrc)" >> $GITHUB_OUTPUT
        id: nvm
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Use Node.js (.nvmrc)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "${{ steps.nvm.outputs.NVMRC }}"
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - uses: chromaui/action@2b75e3340bcec86b4ae38c6a10f14831114e8137 # v18.14.3
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          exitZeroOnChanges: false
  build-and-push:
    needs: [test, test-integration, test-chromatic]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    outputs:
      client_image_tag: master-${{ steps.commit_sha.outputs.commit_sha }}-${{ steps.date.outputs.date }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get current date
        id: date
        run: echo "date=$(date --utc +%Y%m%d.%H%M)" >> $GITHUB_OUTPUT
      - name: Get sha with 8 chars long
        id: commit_sha
        run: echo "commit_sha=${GITHUB_SHA:0:8}" >> $GITHUB_OUTPUT
      - name: Build and push client image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build-push
        with:
          push: true
          load: false
          platforms: linux/amd64,linux/arm64
          target: prod
          tags: |
            ghcr.io/elifesciences/enhanced-preprints-client:latest
            ghcr.io/elifesciences/enhanced-preprints-client:${{ github.sha }}
            ghcr.io/elifesciences/enhanced-preprints-client:master-${{ steps.commit_sha.outputs.commit_sha }}-${{ steps.date.outputs.date }}
      - name: Generate artefact attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/elifesciences/enhanced-preprints-client
          subject-digest: ${{ steps.build-push.outputs.digest }}

  notify-start:
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/master'
    outputs:
      ts: ${{ steps.slack.outputs.ts }}
    steps:
    - name: Notify Slack testing started
      id: slack
      uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
      env:
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_EPP_GITHUB_BOT_TOKEN }}
      with:
        method: chat.postMessage
        token: ${{ secrets.SLACK_EPP_GITHUB_BOT_TOKEN }}
        payload: |
          {
            "channel": "C06FPSVJPUH",
            "text": "EPP Client CI: ${{
              (!needs.test.result || !needs.test-integration.result) &&
                'testing... :sonic:'
              || ((needs.test.result != 'success' || needs.test-integration.result  != 'success' || needs.test-chromatic.result != 'success') &&
                'tests failed'
              || (!needs.build-and-push.result &&
                'building... :sonic:'
              || (needs.build-and-push.result != 'success' &&
                'building failed'
              || 'success'
              )))
            }}",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "EPP Client CI: ${{
                    (!needs.test.result || !needs.test-integration.result) &&
                      'testing... :sonic:'
                    || ((needs.test.result != 'success' || needs.test-integration.result  != 'success' || needs.test-chromatic.result != 'success') &&
                      'tests failed'
                    || (!needs.build-and-push.result &&
                      'building... :sonic:'
                    || (needs.build-and-push.result != 'success' &&
                      'building failed'
                    || 'success'
                    )))
                  }}",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": ${{ toJSON(github.event.commits[0].message || github.event.pull_request.title) }}
                },
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "commit: <${{ github.event.pull_request.html_url || github.event.head_commit.url }}|${{ github.event.pull_request.head.sha || github.event.head_commit.id }}>"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "author: ${{ github.event.pull_request.head.user.login || github.event.commits[0].author.name }}"
                  }
                ]
              },
              {
                "type": "divider"
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Stages:*"
                },
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "${{ !needs.test.result && ':large_orange_circle:' || (needs.test.result == 'success' && ':white_check_mark:' || ':x:') }} Linting and unit tests"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "${{ !needs.test-integration.result && ':large_orange_circle:' || (needs.test-integration.result == 'success' && ':white_check_mark:' || ':x:') }} Integration tests"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "${{ !needs.test-chromatic.result && ':large_orange_circle:' || (needs.test-chromatic.result == 'success' && ':white_check_mark:' || ':x:') }} Visual regression tests"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "${{ (!needs.test.result || needs.test.result != 'success') && ':white_circle:' || (!needs.build-and-push.result && ':large_orange_circle:' || (needs.build-and-push.result == 'success' && ':white_check_mark:' || ':x:'))}} Docker image build ${{ needs.build-and-push.outputs.client_image_tag && format('<https://github.com/elifesciences/enhanced-preprints-client/pkgs/container/enhanced-preprints-client/{0}|({0})>', needs.build-and-push.outputs.client_image_tag) }}"
                  }
                ]
              },
              {
                "type": "divider"
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "<https://github.com/${{github.repository}}/actions/runs/${{ github.run_id }}|View build>"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "<${{ github.event.pull_request.diff_url || github.event.compare }}|View diff>"
                  }
                ]
              }
            ]
          }
  notify-test-result:
    needs: [notify-start, test, test-integration, test-chromatic]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/master'
    steps:
    - name: Notify Slack testing results
      uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
      env:
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_EPP_GITHUB_BOT_TOKEN }}
      with:
        method: chat.update
        token: ${{ secrets.SLACK_EPP_GITHUB_BOT_TOKEN }}
        payload: |
          {
            "channel": "C06FPSVJPUH",
            "ts": "${{ needs['notify-start'].outputs.ts }}",
            "text": "EPP Client CI: ${{
              (!needs.test.result || !needs.test-integration.result) &&
                'testing... :sonic:'
              || ((needs.test.result != 'success' || needs.test-integration.result  != 'success' || needs.test-chromatic.result != 'success') &&
                'tests failed'
              || (!needs.build-and-push.result &&
                'building... :sonic:'
              || (needs.build-and-push.result != 'success' &&
                'building failed'
              || 'success'
              )))
            }}",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "EPP Client CI: ${{
                    (!needs.test.result || !needs.test-integration.result) &&
                      'testing... :sonic:'
                    || ((needs.test.result != 'success' || needs.test-integration.result  != 'success' || needs.test-chromatic.result != 'success') &&
                      'tests failed'
                    || (!needs.build-and-push.result &&
                      'building... :sonic:'
                    || (needs.build-and-push.result != 'success' &&
                      'building failed'
                    || 'success'
                    )))
                  }}",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": ${{ toJSON(github.event.commits[0].message || github.event.pull_request.title) }}
                },
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "commit: <${{ github.event.pull_request.html_url || github.event.head_commit.url }}|${{ github.event.pull_request.head.sha || github.event.head_commit.id }}>"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "author: ${{ github.event.pull_request.head.user.login || github.event.commits[0].author.name }}"
                  }
                ]
              },
              {
                "type": "divider"
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Stages:*"
                },
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "${{ !needs.test.result && ':large_orange_circle:' || (needs.test.result == 'success' && ':white_check_mark:' || ':x:') }} Linting and unit tests"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "${{ !needs.test-integration.result && ':large_orange_circle:' || (needs.test-integration.result == 'success' && ':white_check_mark:' || ':x:') }} Integration tests"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "${{ !needs.test-chromatic.result && ':large_orange_circle:' || (needs.test-chromatic.result == 'success' && ':white_check_mark:' || ':x:') }} Visual regression tests"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "${{ (!needs.test.result || needs.test.result != 'success') && ':white_circle:' || (!needs.build-and-push.result && ':large_orange_circle:' || (needs.build-and-push.result == 'success' && ':white_check_mark:' || ':x:'))}} Docker image build ${{ needs.build-and-push.outputs.client_image_tag && format('<https://github.com/elifesciences/enhanced-preprints-client/pkgs/container/enhanced-preprints-client/{0}|({0})>', needs.build-and-push.outputs.client_image_tag) }}"
                  }
                ]
              },
              {
                "type": "divider"
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "<https://github.com/${{github.repository}}/actions/runs/${{ github.run_id }}|View build>"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "<${{ github.event.pull_request.diff_url || github.event.compare }}|View diff>"
                  }
                ]
              }
            ]
          }
  notify-build-result:
    needs: [notify-start, test, test-integration, test-chromatic, notify-test-result, build-and-push]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/master'
    steps:
    - name: Notify Slack build final message
      uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
      env:
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_EPP_GITHUB_BOT_TOKEN }}
      with:
        method: chat.update
        token: ${{ secrets.SLACK_EPP_GITHUB_BOT_TOKEN }}
        payload: |
          {
            "channel": "C06FPSVJPUH",
            "ts": "${{ needs['notify-start'].outputs.ts }}",
            "text": "EPP Client CI: ${{
              (!needs.test.result || !needs.test-integration.result) &&
                'testing... :sonic:'
              || ((needs.test.result != 'success' || needs.test-integration.result  != 'success' || needs.test-chromatic.result != 'success') &&
                'tests failed'
              || (!needs.build-and-push.result &&
                'building... :sonic:'
              || (needs.build-and-push.result != 'success' &&
                'building failed'
              || 'success'
              )))
            }}",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "EPP Client CI: ${{
                    (!needs.test.result || !needs.test-integration.result) &&
                      'testing... :sonic:'
                    || ((needs.test.result != 'success' || needs.test-integration.result  != 'success' || needs.test-chromatic.result != 'success') &&
                      'tests failed'
                    || (!needs.build-and-push.result &&
                      'building... :sonic:'
                    || (needs.build-and-push.result != 'success' &&
                      'building failed'
                    || 'success'
                    )))
                  }}",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": ${{ toJSON(github.event.commits[0].message || github.event.pull_request.title) }}
                },
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "commit: <${{ github.event.pull_request.html_url || github.event.head_commit.url }}|${{ github.event.pull_request.head.sha || github.event.head_commit.id }}>"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "author: ${{ github.event.pull_request.head.user.login || github.event.commits[0].author.name }}"
                  }
                ]
              },
              {
                "type": "divider"
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Stages:*"
                },
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "${{ !needs.test.result && ':large_orange_circle:' || (needs.test.result == 'success' && ':white_check_mark:' || ':x:') }} Linting and unit tests"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "${{ !needs.test-integration.result && ':large_orange_circle:' || (needs.test-integration.result == 'success' && ':white_check_mark:' || ':x:') }} Integration tests"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "${{ !needs.test-chromatic.result && ':large_orange_circle:' || (needs.test-chromatic.result == 'success' && ':white_check_mark:' || ':x:') }} Visual regression tests"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "${{ (!needs.test.result || needs.test.result != 'success') && ':white_circle:' || (!needs.build-and-push.result && ':large_orange_circle:' || (needs.build-and-push.result == 'success' && ':white_check_mark:' || ':x:'))}} Docker image build ${{ needs.build-and-push.outputs.client_image_tag && format('<https://github.com/elifesciences/enhanced-preprints-client/pkgs/container/enhanced-preprints-client/{0}|({0})>', needs.build-and-push.outputs.client_image_tag) }}"
                  }
                ]
              },
              {
                "type": "divider"
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "<https://github.com/${{github.repository}}/actions/runs/${{ github.run_id }}|View build>"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "<${{ github.event.pull_request.diff_url || github.event.compare }}|View diff>"
                  }
                ]
              }
            ]
          }
