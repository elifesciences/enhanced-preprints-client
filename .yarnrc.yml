nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.18.1.cjs

enableGlobalCache: false

# Convert fetched packages on the main thread rather than a worker pool. This
# cuts peak memory by ~0.5GB when fetching large packages (e.g. next), which
# keeps Mend-hosted Renovate's lockfile updates under its 3GB memory limit.
taskPoolMode: async
