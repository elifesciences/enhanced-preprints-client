# Use a flat node_modules layout, so packages can still resolve dependencies they
# don't declare themselves. A stricter layout would need those fixed first.
nodeLinker: hoisted

overrides:
  '@types/react': 19.2.9
  '@types/react-dom': 19.2.3

# pnpm only runs dependency install scripts that are listed here.
# true: the script is needed (checks or installs a native binary).
# false: the script only prints a message.
allowBuilds:
  '@swc/core': true
  esbuild: true
  unrs-resolver: true
  core-js: false
  core-js-pure: false
