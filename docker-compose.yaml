services:
  # Dependant services

  ## Image Server
  image-server:
    image: ghcr.io/elifesciences/epp-image-server:master-685a14f2-20261113.0714@sha256:353633f0b13ec0c57aa79ed8df544c3b52cb7a07d980692f9445d88fb6c2f59f
    depends_on:
      createbucket:
        condition: service_completed_successfully
    environment:
      - SOURCE_STATIC=S3Source
      - S3SOURCE_ENDPOINT=http://s3mock:9090/
      - S3SOURCE_ACCESS_KEY_ID=s3mock
      - S3SOURCE_SECRET_KEY=s3mock
      - S3SOURCE_BASICLOOKUPSTRATEGY_PATH_PREFIX=automation/
      - S3SOURCE_BASICLOOKUPSTRATEGY_BUCKET_NAME=eppdata
    ports:
      - "8182:8182"
    volumes:
      - ./data:/opt/epp/data
    healthcheck:
      test: curl http://image-server:8182/
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 2s

  ## S3Mock (S3-compatible test double; minio's images are no longer publicly pullable)
  s3mock:
    image: adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    healthcheck:
      test: wget -q -O /dev/null http://s3mock:9090/favicon.ico
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 2s
    ports:
      - "9100:9090"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: eppdata

  # Upload data to the S3Mock bucket
  createbucket:
    image: amazon/aws-cli:2.40.3@sha256:33a16c53ea442e918b58df67301ad76a8fb57082c39f7e78753b898c3f3e87c2
    depends_on:
      s3mock:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://s3mock:9090 s3 cp --recursive /automation-data s3://eppdata/automation;
      exit 0;
      "
    environment:
      AWS_ACCESS_KEY_ID: s3mock
      AWS_SECRET_ACCESS_KEY: s3mock
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./data/automation:/automation-data

  ## EPP server mock
  wiremock:
    image: wiremock/wiremock:3.13.2-1@sha256:8bdd64a25db911ba521a38aebf1590d96767c2d29f3e941e2f496a760bbdf47d
    ports:
      - 3000:3000
    healthcheck:
      test: curl http://wiremock:3000/__admin/health
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    command:
      - --local-response-templating
      - --port
      - "3000"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings
      - ./wiremock/files:/home/wiremock/__files


  ## Main app server
  app:
    build:
      context: .
      target: dev
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'apk add curl; curl -X POST http://app:3000/api/ping'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 2s
    environment:
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-elife}
      API_SERVER: ${API_SERVER:-http://wiremock:3000}
      IIIF_SERVER: ${IIIF_SERVER:-http://image-server:8182/iiif}
      NEXT_PUBLIC_IMAGE_SERVER: /iiif
      NEXT_PUBLIC_FILES_API_PATH: /api/files
      NEXT_PUBLIC_DISABLE_TERMS: ${NEXT_PUBLIC_DISABLE_TERMS:-false}
      TENANT_DOMAIN: ${TENANT_DOMAIN:-}

    ports:
      - 3001:3000
      - 9229:9229
    volumes:
      - ./:/opt/epp-client/
      - node_modules:/opt/epp-client/node_modules

  # Expose API and client via proxy
  nginx:
    image: nginx:latest@sha256:165ddde8751e75a1c907d24ef10d9f6deb08b57e0fe56caf67512486aff76d82
    depends_on:
      wiremock:
        condition: service_healthy
      app:
        condition: service_healthy
      image-server:
        condition: service_healthy
    ports:
      - 8080:80
    volumes:
      - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  data:
  node_modules:
